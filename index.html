<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Baby Tracker — трекер режима малыша</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230b0c10%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22>👶</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Малышка">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-date" id="topDate">—</div>
    <div class="topbar-clock" id="topClock">--:--</div>
  </header>

  <main class="content">

    <section class="name-row">
      <input id="babyName" class="name-input" type="text" maxlength="40" placeholder="Имя малыша" autocomplete="off">
    </section>

    <div id="errorBanner" class="banner banner-error" hidden></div>

    <section id="sleepBanner" class="banner banner-sleep" hidden>
      <span class="sleep-icon">🌙</span>
      <span>Спит уже <strong id="sleepDuration">—</strong></span>
    </section>

    <section class="actions">
      <button class="action-btn" id="btnFeed" data-type="feed">
        <span class="action-icon">🍼</span>
        <span class="action-label">Кормление</span>
      </button>
      <button class="action-btn" id="btnDiaper" data-type="diaper">
        <span class="action-icon">🧷</span>
        <span class="action-label">Подгузник</span>
      </button>
      <button class="action-btn" id="btnSleep" data-type="sleep">
        <span class="action-icon">🌙</span>
        <span class="action-label" id="sleepLabel">Уснула</span>
      </button>
    </section>

    <section class="forecast">
      <h2 class="section-title"><span class="section-icon">📈</span> Прогноз</h2>
      <div class="forecast-list" id="forecastList"></div>
    </section>

    <section class="log">
      <button class="log-toggle" id="logToggle">
        <span class="log-icon">🕐</span>
        <span id="logToggleText">Показать журнал (0)</span>
      </button>
      <div class="log-list" id="logList" hidden></div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
